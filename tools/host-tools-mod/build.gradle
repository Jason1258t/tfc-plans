plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'host.tools'
base { archivesName = 'host-tools' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Проверочный мод (только для runClient): сам создаёт мир, гоняет /host, /ping, таб и пишет итог в лог. В jar не попадает.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version
    mods {
        host_tools { sourceSet sourceSets.main }
        host_tools_devtest { sourceSet sourceSets.devtest }
    }
    addModdingDependenciesTo(sourceSets.devtest)
    // Проверка: ./test-client.sh (клиент разработки), ./test-server.sh (выделенный сервер)
    runs {
        client {
            client()
            sourceSet = sourceSets.devtest
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-server')
            sourceSet = sourceSets.devtest
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
