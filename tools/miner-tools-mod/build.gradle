plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'miner.tools'
base { archivesName = 'miner-tools' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Проверочный мод (только для runServer): команда /belttest гоняет подбор и окно фильтра. В jar не попадает.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version
    mods {
        miner_tools { sourceSet sourceSets.main }
        miner_tools_devtest { sourceSet sourceSets.devtest }
    }
    addModdingDependenciesTo(sourceSets.devtest)
    // Проверочный сервер: ./gradlew runServer. Curios кладёт в run/mods скрипт test-server.sh
    runs {
        server {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.devtest
        }
    }
}

dependencies {
    // Curios из mods/ сборки — только для компиляции (libs.sh)
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
