plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'aero.extra'
base { archivesName = 'create-aeronautics-extra' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Проверочный мод (только для runServer): команда /aetest — бортовой компьютер от творческого мотора, нагрузка, показания. В jar не попадает.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtestCompileOnly.extendsFrom compileOnly
}

neoForge {
    version = project.neo_version
    mods {
        create_aeronautics_extra { sourceSet sourceSets.main }
        create_aeronautics_extra_devtest { sourceSet sourceSets.devtest }
    }
    addModdingDependenciesTo(sourceSets.devtest)
    // Проверочный сервер: ./gradlew runServer. Create и EE кладёт в run/mods скрипт test-server.sh
    runs {
        server {
            server()
            programArgument '--nogui'
            sourceSet = sourceSets.devtest
        }
    }
}

dependencies {
    // Create, Electro Energetics и их вложенные библиотеки — только для компиляции (libs.sh)
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
