description = '''
Бортовая электрика для машин и кораблей Create Aeronautics (сборка TFC Планы): бортовой компьютер — один блок с валом
Create и клеммами Electro Energetics, в который ставятся модули: генераторный (вал → ток) и аккумуляторный (ячейка
